<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farhad Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f5f5f5;

        .box {
            background: white;
            padding: 30px;

            max-width: 500px;

<body>
    <div class="box">

        <p>E-commerce Online Shop Website</p>
